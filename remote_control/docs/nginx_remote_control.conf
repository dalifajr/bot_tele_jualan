# ====================================================================
# Konfigurasi Nginx Reverse Proxy untuk Remote Control Relay Gateway
# Pasang pada blok server website jualan (misal: /etc/nginx/sites-available/jualan.conf)
# ====================================================================

# 1. Definisi Upstream Relay Gateway WebSocket (Port Terisolasi 8099)
upstream remote_relay_backend {
    server 127.0.0.1:8099;
    keepalive 32;
}

# 2. Blok Location WebSocket & Streaming Biner H.264
location /ws/ {
    proxy_pass http://remote_relay_backend;
    proxy_http_version 1.1;

    # Header Wajib WebSocket Upgrade RFC 6455
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Forwarding Header Jaringan
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Mencegah timeout koneksi remote control yang sedang aktif
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_connect_timeout 60s;

    # Nonaktifkan buffering untuk transmisi video frame latensi rendah (< 50ms)
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding off;
}

# 3. Blok Location REST API Telemetri Perangkat
location /api/devices {
    proxy_pass http://remote_relay_backend/api/devices;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}
